services:
  social-post-agent:
    build: .
    image: social-post-agent:local
    env_file: .env
    ports:
      # localhost only: put a reverse proxy with https (Caddy, nginx, Traefik...) in front.
      # To expose the port directly instead, drop "127.0.0.1:" and set FORWARDED_ALLOW_IPS=127.0.0.1.
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - agent-data:/data          # SQLite database + media files
    restart: unless-stopped

volumes:
  agent-data:
