[project]
name = "social-post-agent"
version = "0.1.0"
description = "UI-less social media posting agent with a REST API and an MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "B008", "B904"]
